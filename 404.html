<style>

@font-face{font-family:"IBM Plex Mono";src:url(/fonts/plex-mono-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}

<style>
/* Layout: a drawing sheet. Mono section labels in a left gutter, content on the right,
   and a technical-drawing title block (antet) as the one signature element in the hero. */
:root{
  --paper:#ECEEEA;
  --ink:#15181B;
  --ink-2:#4E555C;
  --ink-3:#5E656C;
  --rule:#C8CCC6;
  --mark:#E2B000;
  --mark-ink:#15181B;
  --disc:#FFFFFF;
  --disc-ink:#15181B;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --s-0:.78rem; --s-1:.9rem; --s-2:1rem; --s-3:1.2rem; --s-5:clamp(2.6rem,8vw,4.6rem);
  --gutter:11rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111315; --ink:#E4E6E1; --ink-2:#A7ADB2; --ink-3:#8C939A;
    --rule:#2C3135; --mark:#E8BC2C; --mark-ink:#111315; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111315; --ink:#E4E6E1; --ink-2:#A7ADB2; --ink-3:#8C939A;
  --rule:#2C3135; --mark:#E8BC2C; --mark-ink:#111315; color-scheme:dark;
}

:root:not([data-lang]) [lang="en"],
:root[data-lang="tr"] [lang="en"],
:root[data-lang="en"] [lang="tr"]{display:none}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:var(--s-2); line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration-color:var(--ink-3); text-underline-offset:.18em; text-decoration-thickness:1px}
a:hover{text-decoration-color:var(--mark); text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--mark); outline-offset:3px; border-radius:2px}

.wrap{
  max-width:62rem; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:1.5rem 4rem;
}

/* top bar */
.bar{
  display:flex; justify-content:space-between; align-items:center; gap:1rem;
  font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2);
  padding-bottom:.9rem; border-bottom:1px solid var(--ink);
}
.bar .site{letter-spacing:.04em; color:var(--ink)}
.right{display:flex; align-items:center; gap:1rem}
.clock{font-variant-numeric:tabular-nums; min-width:12ch; text-align:right}
.lang{display:flex; border:1px solid var(--ink)}
.lang button{
  font:500 var(--s-0)/1 var(--f-mono); letter-spacing:.08em;
  background:transparent; color:var(--ink); border:0; padding:.5rem .7rem; cursor:pointer;
}
.lang button + button{border-left:1px solid var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}

/* hero */
.hero{
  display:grid; grid-template-columns:minmax(0,1fr); gap:2.6rem;
  padding-block:3.2rem 2.4rem; border-bottom:1px solid var(--rule);
}
.hero .role{max-width:46ch}
.eyebrow{
  margin:0 0 1rem; font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2);
  text-transform:uppercase; letter-spacing:.1em;
}
.hero h1{
  font-family:var(--f-display); font-stretch:68%; font-weight:760;
  font-size:var(--s-5); line-height:.92; letter-spacing:-.01em; margin:0;
  text-wrap:balance;
}
.hero h1 .given{display:block; color:var(--ink-2); font-weight:520}
.role{margin:1.2rem 0 0; font-size:var(--s-3); line-height:1.45; max-width:34ch; text-wrap:pretty}
.role mark{background:linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); color:inherit; padding:0 .1em}
.role em{font-style:normal; font-family:var(--f-mono); font-size:.9em}
.contact{
  margin:1.6rem 0 0; display:flex; flex-wrap:wrap; gap:.4rem 1.4rem;
  font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2);
}
.contact a{color:var(--ink); display:inline-flex; align-items:center; min-height:24px}
.copy{
  min-height:24px; min-width:24px;
  font:inherit; color:var(--ink-2); background:none; border:0; padding:0; cursor:pointer;
  text-decoration:underline dotted; text-underline-offset:.2em;
}
.copy:hover{color:var(--ink)}

/* career line: one row, chronological, a logo frame per institution */
.ruler{margin:0; min-width:0}
.tl-scroll{overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; padding-top:.2rem}
.tl-scroll::-webkit-scrollbar{display:none}
.tl{
  list-style:none; margin:0; padding:0; position:relative;
  --n:8; display:grid; grid-template-columns:repeat(var(--n), minmax(6.4rem,1fr)) 3.6rem;
}
.tl::before{content:""; position:absolute; left:0; right:1.5rem; top:1.8rem; height:1px; background:var(--ink)}
.tl-item{position:relative; padding-right:.9rem; min-width:0; scroll-snap-align:start}
.logo{
  position:relative; z-index:1; width:3.6rem; height:3.6rem; border-radius:50%; padding:2px;
  display:grid; place-items:center; overflow:hidden;
  background:var(--disc); background-clip:content-box; box-shadow:0 0 0 4px var(--paper);
}
.logo img{
  width:100%; height:100%; object-fit:cover; border-radius:50%;
  filter:grayscale(1) contrast(1.08); opacity:.82; transition:filter .35s ease, opacity .35s ease;
}
.tl-item.current .logo img,
.tl-item.lit .logo img{filter:none; opacity:1}
@media (hover: hover){ .tl-item:hover .logo img{filter:none; opacity:1} }
@media (prefers-reduced-motion: reduce){ .logo img{transition:none} }
.work .logo{border:2px solid var(--ink)}
.edu .logo{border:3px solid var(--mark)}
.mono{font-family:var(--f-display); font-stretch:72%; font-weight:720; font-size:1.15rem; letter-spacing:.01em; color:var(--disc-ink)}
.tl-name{display:block; margin-top:.75rem; font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:.95rem; line-height:1.25; text-wrap:balance}
.tl-role{display:block; margin-top:.15rem; font-size:.8rem; line-height:1.35; color:var(--ink-2)}
.tl-when{display:block; margin-top:.4rem; font-family:var(--f-mono); font-size:.68rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
.tl-when .dur2{display:block; color:var(--ink)}
.tl-end{position:relative; min-width:0}
.tl-end b{
  position:absolute; left:0; top:1.8rem; transform:translateY(-50%); white-space:nowrap;
  font:500 .68rem/1 var(--f-mono); background:var(--mark); color:var(--mark-ink); padding:.3rem .45rem;
}
@media (max-width: 760px){
  .tl{grid-template-columns:repeat(var(--n), 8.6rem) 3.8rem; width:max-content}
  .tl-scroll.fl{-webkit-mask-image:linear-gradient(90deg, transparent 0, #000 2rem); mask-image:linear-gradient(90deg, transparent 0, #000 2rem)}
  .tl-scroll.fr{-webkit-mask-image:linear-gradient(270deg, transparent 0, #000 2rem); mask-image:linear-gradient(270deg, transparent 0, #000 2rem)}
  .tl-scroll.fl.fr{-webkit-mask-image:linear-gradient(90deg, transparent 0, #000 2rem, #000 calc(100% - 2rem), transparent 100%); mask-image:linear-gradient(90deg, transparent 0, #000 2rem, #000 calc(100% - 2rem), transparent 100%)}
}

.ruler-foot{
  display:flex; justify-content:space-between; align-items:flex-end; gap:.8rem 1.5rem; flex-wrap:wrap;
  margin-top:1.1rem;
}
.legend{display:flex; gap:1rem; font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2); align-items:center}
.sw{display:inline-block; width:.85rem; height:.85rem; border-radius:50%; margin-right:.35rem; vertical-align:-.02em}
.sw.work{border:2px solid var(--ink)}
.sw.edu{border:3px solid var(--mark)}
.total{display:flex; align-items:baseline; gap:.4rem .8rem; flex-wrap:wrap}
.total .k{font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2); text-transform:uppercase; letter-spacing:.08em}
.total .big{
  font-family:var(--f-display); font-stretch:72%; font-weight:720; font-size:1.9rem; line-height:1;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 94%, transparent 94%); padding:0 .12em;
}
.total .days{min-width:7ch; font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2); font-variant-numeric:tabular-nums}
@media (max-width: 760px){ .ruler-foot{border-top:1px solid var(--rule); padding-top:.9rem} }

/* sections */
section.row{
  display:grid; grid-template-columns:var(--gutter) minmax(0,1fr); gap:1.5rem 2rem;
  padding-block:2.2rem; border-bottom:1px solid var(--rule);
}
h2.label{
  margin:0; font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2); font-weight:400;
  text-transform:uppercase; letter-spacing:.09em; padding-top:.25rem;
}
.label .sum{display:block; margin-top:.35rem; text-transform:none; letter-spacing:0; color:var(--ink); font-variant-numeric:tabular-nums}
@media (min-width: 761px){
  section.row .label{position:sticky; top:1.5rem; align-self:start}
}
.body{min-width:0}
.lead{font-size:var(--s-3); line-height:1.5; max-width:62ch; margin:0}
p{margin:0; max-width:65ch}
.lead + p{margin-top:1rem}

.entries{display:grid; gap:1.8rem; margin:0; padding:0; list-style:none}
.entry{display:grid; grid-template-columns:9.5rem minmax(0,1fr); gap:.3rem 1.5rem}
.when{
  font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2);
  font-variant-numeric:tabular-nums; padding-top:.2rem; white-space:nowrap;
}
.when .dur{display:block; color:var(--ink-3); margin-top:.15rem}
.entry h3{
  font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:var(--s-3);
  line-height:1.25; margin:0; text-wrap:balance;
}
.org{color:var(--ink-2); font-size:var(--s-1); margin:.1rem 0 .55rem}
.entry ul{margin:0; padding:0; list-style:none; display:grid; gap:.4rem; max-width:65ch}
.entry li{position:relative; padding-left:1.1rem; font-size:var(--s-1); line-height:1.55}
.entry li::before{content:""; position:absolute; left:0; top:.72em; width:.5rem; height:1px; background:var(--ink-3)}
.entry .note{font-size:var(--s-1); color:var(--ink-2); max-width:65ch}
.now{
  display:inline-block; margin-left:.4rem; vertical-align:.15em;
  font:500 .62rem/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase;
  background:var(--mark); color:var(--mark-ink); padding:.25rem .35rem;
}

.areas{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:1.6rem 2.2rem}
.areas article{min-width:0; border-top:1px solid var(--ink); padding-top:.7rem}
.areas h3{font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:var(--s-2); line-height:1.3; margin:0 0 .35rem; text-wrap:balance}
.areas p{font-size:var(--s-1); color:var(--ink-2); line-height:1.55}
@media (max-width: 560px){ .areas{grid-template-columns:1fr; gap:1.2rem} }

.pubs{list-style:none; margin:0; padding:0; display:grid; gap:1.4rem}
.pubs li{display:grid; grid-template-columns:9.5rem minmax(0,1fr); gap:.3rem 1.5rem}
.pubs .cite{font-size:var(--s-1); line-height:1.6; max-width:65ch}
.pubs .t{display:block; font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:var(--s-3); line-height:1.3; margin-bottom:.35rem}

.cite-tools{display:flex; align-items:center; gap:.5rem; margin-top:.6rem; flex-wrap:wrap}
.cite-btn{
  font:500 var(--s-0)/1 var(--f-mono); letter-spacing:.04em; color:var(--ink); background:transparent;
  border:1px solid var(--ink-3); padding:.35rem .55rem; min-height:28px; cursor:pointer;
}
.cite-btn:hover{border-color:var(--ink)}
.cite-msg{font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2)}
.stance{margin-top:1.1rem; font-size:var(--s-1); color:var(--ink-2); max-width:62ch}
.print-only{display:none}

/* writing carousel */
.post [lang]{display:revert !important}
.posts{
  list-style:none; margin:0; padding:0; display:grid; grid-auto-flow:column;
  grid-auto-columns:calc((100% - 1.25rem)/2); gap:1.25rem;
  overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; overscroll-behavior-x:contain;
}
.posts::-webkit-scrollbar{display:none}
.post{scroll-snap-align:start; min-width:0; border-top:2px solid var(--ink)}
.post-link{display:flex; flex-direction:column; gap:.45rem; padding-top:.8rem; height:100%; text-decoration:none; color:inherit}
a.post-link:hover .post-title{text-decoration:underline; text-decoration-color:var(--mark); text-decoration-thickness:2px; text-underline-offset:.2em}
.post-meta{font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2); display:flex; gap:.6rem; align-items:center; font-variant-numeric:tabular-nums}
.post-title{font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:var(--s-3); line-height:1.25; text-wrap:balance}
.post-sum{font-size:var(--s-1); color:var(--ink-2); line-height:1.55}
.draft{font:500 .62rem/1 var(--f-mono); letter-spacing:.08em; text-transform:uppercase; background:var(--mark); color:var(--mark-ink); padding:.25rem .35rem}
.posts-nav{display:flex; gap:1rem; justify-content:space-between; align-items:center; margin-top:1rem}
.pn-group{display:flex; gap:.5rem; margin-left:auto}
.rss{font-family:var(--f-mono); font-size:var(--s-0); display:inline-flex; align-items:center; min-height:24px}
.pn{
  width:2.4rem; height:2.4rem; font:500 1rem/1 var(--f-mono); color:var(--ink);
  background:transparent; border:1px solid var(--ink); cursor:pointer;
}
.pn:disabled{opacity:.35; cursor:default}
@media (max-width: 760px){ .posts{grid-auto-columns:82%} }
.cite-src{margin:.6rem 0 0; padding:.6rem .7rem; font:var(--s-0)/1.5 var(--f-mono); white-space:pre-wrap; overflow-wrap:anywhere; border:1px solid var(--rule); color:var(--ink)}

.sched{width:100%; border-collapse:collapse; font-size:var(--s-1)}
.sched th{
  text-align:left; vertical-align:top; font-weight:500; width:12rem;
  font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2);
  text-transform:uppercase; letter-spacing:.07em; padding:.7rem 1rem .7rem 0;
}
.sched td{padding:.65rem 0; line-height:1.55}
.sched tr + tr th,.sched tr + tr td{border-top:1px solid var(--rule)}

.foot{
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; padding-top:1.2rem;
  font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-3);
}

.swap .wrap > :not(.bar){animation:swap .32s ease}
@keyframes swap{from{opacity:.2; transform:translateY(3px)} to{opacity:1; transform:none}}

@media (max-width: 760px){
  .hero{grid-template-columns:1fr; gap:2rem; padding-block:2rem}
  section.row{grid-template-columns:1fr; gap:1rem; padding-block:1.8rem}
  .entry,.pubs li{grid-template-columns:1fr}
  .sched th{display:block; width:auto; padding:.8rem 0 .2rem}
  .sched td{display:block; padding:0 0 .8rem}
  .sched tr + tr td{border-top:0}
}
@media (max-width: 380px){ .clock{display:none} }

/* print: the page becomes a two-page CV */
@media print{
  :root:not(#print){
    --paper:#FFFFFF; --ink:#111316; --ink-2:#3F454B; --ink-3:#6A7076; --rule:#CFD2CC;
    --mark:#E2B000; --mark-ink:#111316; color-scheme:light;
  }
  @page{size:A4; margin:13mm 14mm 15mm}
  body{font-size:8.8pt; line-height:1.4}
  .wrap{max-width:none; padding:0}
  .bar,.ruler,.copy,.cv,.cite-tools,#sec-areas,#sec-contact,#sec-posts{display:none !important}
  .print-only{display:inline !important}
  .hero{padding-block:0 5mm; gap:2mm}
  .eyebrow{margin-bottom:2mm}
  .hero h1{font-size:26pt}
  .hero .role{font-size:10pt; max-width:none; margin-top:3mm}
  .contact{margin-top:3mm; gap:1mm 5mm}
  section.row{grid-template-columns:24mm minmax(0,1fr); gap:2mm 5mm; padding-block:3.6mm}
  section.row .label{position:static}
  .lead{font-size:9.4pt}
  .lead + p{margin-top:2mm}
  .when{white-space:normal; font-size:7.6pt}
  .entries{gap:3mm}
  .entry,.pubs li{grid-template-columns:27mm minmax(0,1fr); gap:1mm 4mm; break-inside:avoid}
  .pubs{gap:3mm}
  .entry h3,.pubs .t{font-size:10pt}
  .entry li{font-size:8.8pt}
  .org{margin-bottom:1.2mm}
  .entry ul{gap:.8mm}
  .now{background:none; box-shadow:inset 0 0 0 1px var(--ink)}
  .role mark{background:none}
  a{text-decoration:none}
  .sched th{width:30mm}
  .foot{padding-top:3mm}
}
@media (prefers-reduced-motion: reduce){ .swap .wrap > :not(.bar){animation:none} }
</style>
<style>
.sub-bar a{text-decoration:none}
.article{padding-block:3rem 2.5rem; border-bottom:1px solid var(--rule)}
.article .eyebrow{margin:0}
.article h1{font-family:var(--f-display); font-stretch:72%; font-weight:720; font-size:clamp(2.1rem,6vw,3.3rem); line-height:1.02; margin:.7rem 0 1rem; text-wrap:balance; max-width:22ch}
.dek{font-size:var(--s-3); color:var(--ink-2); max-width:52ch; margin:0}
.prose{margin-top:2.4rem; font-size:1.04rem; line-height:1.72; max-width:42rem}
.prose > *{max-width:65ch}
.prose h2{font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:1.4rem; line-height:1.25; margin:2.4rem 0 .7rem}
.prose h3{font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:1.1rem; margin:1.8rem 0 .5rem}
.prose p,.prose ul,.prose ol{margin:0 0 1.05rem}
.prose li{margin-bottom:.3rem}
.prose code{font-family:var(--f-mono); font-size:.86em; padding:.05em .3em; box-shadow:inset 0 0 0 1px var(--rule)}
.prose pre{max-width:100%; overflow-x:auto; margin:0 0 1.2rem; padding:1rem 1.1rem; box-shadow:inset 0 0 0 1px var(--rule); font:.84rem/1.6 var(--f-mono)}
.prose pre code{box-shadow:none; padding:0; font-size:inherit}
.prose img{max-width:100%; height:auto}
.prose blockquote{margin:0 0 1.1rem; padding-left:1rem; box-shadow:inset 2px 0 0 var(--mark); color:var(--ink-2)}
.prose table{border-collapse:collapse; display:block; overflow-x:auto; font-size:.92rem; margin-bottom:1.2rem}
.prose th,.prose td{border-bottom:1px solid var(--rule); padding:.45rem .8rem .45rem 0; text-align:left; vertical-align:top}
.related{padding-block:2.2rem; border-bottom:1px solid var(--rule)}
.related h2{margin:0 0 1rem}
.rel-list{list-style:none; margin:0; padding:0; display:grid; gap:0}
.rel-list li{border-top:1px solid var(--rule)}
.rel-list li:first-child{border-top-color:var(--ink)}
.rel-list a{display:grid; grid-template-columns:7.5rem minmax(0,1fr); gap:.2rem 1.2rem; padding:.8rem 0; text-decoration:none; min-height:24px}
.rel-list time{font-family:var(--f-mono); font-size:var(--s-0); color:var(--ink-2); padding-top:.2rem; font-variant-numeric:tabular-nums}
.rel-list span{font-family:var(--f-display); font-stretch:85%; font-weight:650; font-size:var(--s-2); line-height:1.3}
